<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watchman Checker</title>
<style>
  :root {
    --bg: #0d0f12;
    --surface: #141720;
    --surface2: #1c2030;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --text: #e2e4ec;
    --muted: #6b7280;
    --accent: #5b8ef5;
    --green: #22c55e;
    --red: #ef4444;
    --amber: #f59e0b;
    --purple: #a78bfa;
    --cyan: #22d3ee;
    --font: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 13px;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; color: var(--accent); }
  .logo span { color: var(--text); }
  .dot-live {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--green); box-shadow: 0 0 6px var(--green);
    animation: pulse 2s ease-in-out infinite;
  }
  .dot-live.err { background: var(--red); box-shadow: 0 0 6px var(--red); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
  .stat-pill {
    font-size: 11px; padding: 3px 10px; border-radius: 20px;
    border: 1px solid var(--border2); color: var(--muted);
  }
  .stat-pill b { color: var(--text); }
  .refresh-btn {
    font-family: var(--font); font-size: 11px; padding: 4px 12px;
    border-radius: 6px; border: 1px solid var(--border2);
    background: transparent; color: var(--muted); cursor: pointer; transition: all .15s;
  }
  .refresh-btn:hover { background: var(--surface2); color: var(--text); }

  /* ── Layout ── */
  .layout {
    display: grid;
    grid-template-columns: 260px 1fr;
    height: calc(100vh - 52px);
  }

  /* ── Sidebar ── */
  aside {
    border-right: 1px solid var(--border);
    background: var(--surface);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .aside-section { padding: 16px; border-bottom: 1px solid var(--border); }
  .aside-label {
    font-size: 10px; text-transform: uppercase;
    letter-spacing: 1px; color: var(--muted); margin-bottom: 12px;
  }
  .metric-row {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 10px;
  }
  .metric-row:last-child { margin-bottom: 0; }
  .metric-label { color: var(--muted); font-size: 12px; }
  .metric-val { font-size: 18px; font-weight: 700; }
  .metric-val.green  { color: var(--green); }
  .metric-val.red    { color: var(--red); }
  .metric-val.amber  { color: var(--amber); }
  .metric-val.blue   { color: var(--accent); }

  /* filter buttons */
  .filter-group { display: flex; flex-direction: column; gap: 6px; }
  .filter-btn {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px; border-radius: 6px;
    border: 1px solid transparent; background: transparent;
    color: var(--muted); font-family: var(--font); font-size: 12px;
    cursor: pointer; text-align: left; transition: all .15s;
  }
  .filter-btn:hover { background: var(--surface2); color: var(--text); }
  .filter-btn.active { background: var(--surface2); border-color: var(--border2); color: var(--text); }
  .filter-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .filter-count {
    margin-left: auto; font-size: 11px;
    background: var(--border); padding: 1px 6px; border-radius: 10px;
  }

  /* threshold display */
  .threshold-block {
    background: var(--surface2); border: 1px solid var(--border2);
    border-radius: 8px; padding: 10px 12px;
  }
  .threshold-val { font-size: 22px; font-weight: 700; color: var(--accent); }
  .threshold-sub { font-size: 10px; color: var(--muted); margin-top: 2px; }

  /* ── Main feed ── */
  main { display: flex; flex-direction: column; overflow: hidden; }
  .feed-header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; border-bottom: 1px solid var(--border);
    font-size: 11px; color: var(--muted);
  }
  .feed-header input {
    font-family: var(--font); font-size: 12px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); padding: 5px 10px;
    outline: none; width: 220px; transition: border .15s;
  }
  .feed-header input:focus { border-color: var(--accent); }
  .feed-header input::placeholder { color: var(--muted); }
  .tab-row { display: flex; gap: 4px; margin-left: auto; }
  .tab-btn {
    font-family: var(--font); font-size: 11px; padding: 4px 12px;
    border-radius: 5px; border: 1px solid var(--border2);
    background: transparent; color: var(--muted); cursor: pointer; transition: all .15s;
  }
  .tab-btn.active { background: var(--surface2); color: var(--text); border-color: var(--accent); }

  /* fix cards list */
  #fix-feed {
    flex: 1; overflow-y: auto; padding: 0;
    scrollbar-width: thin; scrollbar-color: var(--border2) transparent;
  }
  #fix-feed::-webkit-scrollbar { width: 6px; }
  #fix-feed::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

  /* empty state */
  .empty-state {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100%; gap: 10px; color: var(--muted); font-size: 12px;
  }
  .empty-state .big { font-size: 32px; }

  /* ── Fix card ── */
  .fix-card {
    border-bottom: 1px solid var(--border);
    transition: background .1s;
    animation: slideIn .2s ease;
  }
  @keyframes slideIn { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:none} }
  .fix-card-inner { padding: 14px 20px; }

  .card-top {
    display: flex; align-items: center; gap: 10px; margin-bottom: 8px;
  }
  .status-badge {
    font-size: 9px; font-weight: 700; letter-spacing: .5px;
    padding: 2px 7px; border-radius: 4px; flex-shrink: 0;
  }
  .badge-pending  { background: rgba(245,158,11,.15); color: var(--amber); }
  .badge-approved { background: rgba(34,197,94,.15);  color: var(--green); }
  .badge-rejected { background: rgba(239,68,68,.15);  color: var(--red); }
  .badge-applied  { background: rgba(91,142,245,.15); color: var(--accent); }

  .conf-ring {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; flex-shrink: 0;
    border: 2px solid var(--border2);
  }
  .conf-ring.high { border-color: var(--green); color: var(--green); }
  .conf-ring.mid  { border-color: var(--amber); color: var(--amber); }
  .conf-ring.low  { border-color: var(--red);   color: var(--red);   }

  .card-title { font-weight: 600; font-size: 13px; }
  .card-sub   { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .card-time  { margin-left: auto; font-size: 11px; color: var(--muted); flex-shrink: 0; }

  /* diff row */
  .diff-row {
    display: grid; grid-template-columns: 1fr auto 1fr;
    gap: 8px; align-items: center; margin: 10px 0;
  }
  .diff-box {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 10px; font-size: 11px;
  }
  .diff-box-label { font-size: 9px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing:.5px; }
  .diff-field { display: flex; justify-content: space-between; margin-bottom: 3px; }
  .diff-field:last-child { margin-bottom: 0; }
  .diff-key  { color: var(--muted); }
  .diff-val  { color: var(--text); }
  .diff-val.changed { color: var(--amber); }
  .diff-val.fixed   { color: var(--green); }
  .diff-arrow { color: var(--muted); font-size: 14px; }

  /* issues strip */
  .issues-strip { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .issue-tag {
    font-size: 10px; padding: 2px 8px; border-radius: 10px;
    background: rgba(239,68,68,.1); color: #f87171;
    border: 1px solid rgba(239,68,68,.2);
  }

  /* explanation box */
  .explanation-box {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 12px; font-size: 11px;
    color: var(--muted); margin-bottom: 12px; line-height: 1.6;
  }
  .explanation-box span { color: var(--text); }

  /* validation errors */
  .val-errors {
    background: rgba(239,68,68,.05); border: 1px solid rgba(239,68,68,.15);
    border-radius: 6px; padding: 8px 12px; margin-bottom: 12px;
  }
  .val-error-label { font-size: 10px; color: var(--red); margin-bottom: 4px; text-transform: uppercase; letter-spacing:.5px; }
  .val-error-item  { font-size: 11px; color: #f87171; padding: 2px 0; }

  /* action buttons */
  .action-row { display: flex; gap: 8px; }
  .btn {
    font-family: var(--font); font-size: 12px; font-weight: 600;
    padding: 7px 18px; border-radius: 6px; border: none;
    cursor: pointer; transition: all .15s; flex: 1;
  }
  .btn-approve {
    background: rgba(34,197,94,.15); color: var(--green);
    border: 1px solid rgba(34,197,94,.3);
  }
  .btn-approve:hover { background: rgba(34,197,94,.25); }
  .btn-reject {
    background: rgba(239,68,68,.12); color: var(--red);
    border: 1px solid rgba(239,68,68,.25);
  }
  .btn-reject:hover { background: rgba(239,68,68,.22); }
  .btn:disabled {
    opacity: .4; cursor: not-allowed;
  }

  /* decided banner */
  .decided-banner {
    padding: 8px 12px; border-radius: 6px; font-size: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .decided-banner.approved { background: rgba(34,197,94,.1); color: var(--green); border: 1px solid rgba(34,197,94,.2); }
  .decided-banner.rejected { background: rgba(239,68,68,.1); color: var(--red);   border: 1px solid rgba(239,68,68,.2); }

  /* reject modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.6); z-index: 200;
    align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border2);
    border-radius: 12px; padding: 24px; width: 420px; max-width: 90vw;
  }
  .modal-title { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
  .modal-sub   { font-size: 11px; color: var(--muted); margin-bottom: 16px; }
  .modal textarea {
    font-family: var(--font); font-size: 12px; width: 100%;
    background: var(--surface2); border: 1px solid var(--border2);
    border-radius: 6px; color: var(--text); padding: 10px 12px;
    resize: vertical; min-height: 80px; outline: none; transition: border .15s;
  }
  .modal textarea:focus { border-color: var(--accent); }
  .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
  .modal-cancel {
    font-family: var(--font); font-size: 12px; padding: 7px 16px;
    border-radius: 6px; border: 1px solid var(--border2);
    background: transparent; color: var(--muted); cursor: pointer;
  }
  .modal-confirm {
    font-family: var(--font); font-size: 12px; font-weight: 600;
    padding: 7px 16px; border-radius: 6px; border: none;
    background: var(--red); color: white; cursor: pointer; flex: 1;
  }

  /* toast */
  #toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--surface); border: 1px solid var(--border2);
    border-radius: 8px; padding: 12px 16px; font-size: 12px;
    display: none; z-index: 300; animation: slideIn .2s ease;
    max-width: 320px;
  }
  #toast.show { display: block; }
  #toast.ok   { border-color: rgba(34,197,94,.4);  color: var(--green); }
  #toast.err  { border-color: rgba(239,68,68,.4);  color: var(--red);   }

  /* conn bar */
  .conn-bar {
    padding: 6px 20px; font-size: 11px;
    background: var(--surface); border-top: 1px solid var(--border);
    color: var(--muted); display: flex; align-items: center; gap: 8px;
  }
  .conn-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
  .conn-dot.err { background: var(--red); }
</style>
</head>
<body>

<!-- Reject reason modal -->
<div class="modal-overlay" id="reject-modal">
  <div class="modal">
    <div class="modal-title">Reject this fix?</div>
    <div class="modal-sub" id="modal-fix-id">fix_id: —</div>
    <textarea id="reject-reason" placeholder="Reason for rejection (optional)…"></textarea>
    <div class="modal-actions">
      <button class="modal-cancel" onclick="closeModal()">Cancel</button>
      <button class="modal-confirm" onclick="confirmReject()">Confirm Reject</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- Header -->
<header>
  <div class="logo">watch<span>man</span></div>
  <div class="dot-live" id="live-dot"></div>
  <span style="font-size:11px;color:var(--muted)">Checker</span>
  <div class="header-right">
    <div class="stat-pill">Pending: <b id="h-pending" style="color:var(--amber)">0</b></div>
    <div class="stat-pill">Approved: <b id="h-approved" style="color:var(--green)">0</b></div>
    <div class="stat-pill">Rejected: <b id="h-rejected" style="color:var(--red)">0</b></div>
    <button class="refresh-btn" onclick="loadFixes()">↻ Refresh</button>
  </div>
</header>

<div class="layout">

  <!-- Sidebar -->
  <aside>
    <!-- Stats -->
    <div class="aside-section">
      <div class="aside-label">Queue Overview</div>
      <div class="metric-row"><span class="metric-label">Pending review</span><span class="metric-val amber" id="s-pending">0</span></div>
      <div class="metric-row"><span class="metric-label">Auto-approved</span><span class="metric-val green" id="s-auto">0</span></div>
      <div class="metric-row"><span class="metric-label">Human approved</span><span class="metric-val blue" id="s-human">0</span></div>
      <div class="metric-row"><span class="metric-label">Rejected</span><span class="metric-val red" id="s-rejected">0</span></div>
    </div>

    <!-- Threshold -->
    <div class="aside-section">
      <div class="aside-label">Auto-approve threshold</div>
      <div class="threshold-block">
        <div class="threshold-val">≥ 80%</div>
        <div class="threshold-sub">Fixes above this confidence are applied automatically</div>
      </div>
    </div>

    <!-- Filters -->
    <div class="aside-section" style="flex:1;overflow-y:auto">
      <div class="aside-label">Filter</div>
      <div class="filter-group">
        <button class="filter-btn active" onclick="setFilter('all',this)">
          <span class="filter-dot" style="background:var(--accent)"></span>All fixes
          <span class="filter-count" id="f-all">0</span>
        </button>
        <button class="filter-btn" onclick="setFilter('pending',this)">
          <span class="filter-dot" style="background:var(--amber)"></span>Pending
          <span class="filter-count" id="f-pending">0</span>
        </button>
        <button class="filter-btn" onclick="setFilter('approved',this)">
          <span class="filter-dot" style="background:var(--green)"></span>Approved
          <span class="filter-count" id="f-approved">0</span>
        </button>
        <button class="filter-btn" onclick="setFilter('rejected',this)">
          <span class="filter-dot" style="background:var(--red)"></span>Rejected
          <span class="filter-count" id="f-rejected">0</span>
        </button>
      </div>
    </div>

    <!-- API endpoint -->
    <div class="aside-section">
      <div class="aside-label">API</div>
      <div style="font-size:11px;color:var(--cyan);background:var(--surface2);border:1px solid var(--border2);border-radius:6px;padding:6px 10px;word-break:break-all">
        http://localhost:8000
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main>
    <div class="feed-header">
      <input type="text" id="search-box" placeholder="Search by name, fix id, issue…" oninput="renderFeed()">
      <div class="tab-row">
        <button class="tab-btn active" id="tab-cards" onclick="setTab('cards',this)">Cards</button>
        <button class="tab-btn" id="tab-table" onclick="setTab('table',this)">Table</button>
      </div>
    </div>

    <div id="fix-feed"></div>

    <div class="conn-bar">
      <div class="conn-dot err" id="ws-dot"></div>
      <span id="ws-status">Connecting to API…</span>
      <button onclick="loadFixes()" style="margin-left:auto;font-family:var(--font);font-size:11px;padding:3px 10px;border-radius:5px;border:1px solid var(--border2);background:transparent;color:var(--accent);cursor:pointer">Load fixes</button>
    </div>
  </main>
</div>

<script>
const API = 'http://localhost:8000';
const WS  = 'ws://localhost:8000/ws';

// ── State ─────────────────────────────────────────────────────────────────────
const state = {
  fixes:   [],          // all fixes loaded from API
  filter:  'all',
  tab:     'cards',
  counts:  { pending:0, approved:0, rejected:0, auto:0, human:0 },
};

// ── Modal state ───────────────────────────────────────────────────────────────
let _pendingRejectId = null;

// ── WebSocket ─────────────────────────────────────────────────────────────────
let ws = null;
function connectWS() {
  ws = new WebSocket(WS);
  ws.onopen = () => {
    document.getElementById('ws-dot').classList.remove('err');
    document.getElementById('ws-status').textContent = 'Live — connected to Checker API';
  };
  ws.onmessage = e => {
    try {
      const msg = JSON.parse(e.data);
      // A fix was approved or rejected — reload to reflect changes
      if (msg.event === 'approved' || msg.event === 'rejected') {
        showToast(
          msg.event === 'approved'
            ? `✅ fix approved — applied to DB`
            : `❌ fix rejected`,
          msg.event === 'approved' ? 'ok' : 'err'
        );
        loadFixes();
      }
    } catch(_) {}
  };
  ws.onclose = () => {
    document.getElementById('ws-dot').classList.add('err');
    document.getElementById('ws-status').textContent = 'Disconnected — retrying…';
    setTimeout(connectWS, 3000);
  };
}

// ── Load fixes from API ───────────────────────────────────────────────────────
async function loadFixes() {
  try {
    const res  = await fetch(`${API}/pending`);
    const data = await res.json();

    // pending comes from /pending endpoint
    const pending = (data.fixes || []).map(f => ({ ...f, status: f.status || 'pending' }));

    // Merge into state — keep existing approved/rejected decisions in memory
    const existingDecided = state.fixes.filter(f => f.status !== 'pending');
    const pendingIds      = new Set(pending.map(f => f.fix_id));

    // Update status of any previously pending that are now gone (were decided)
    const updatedDecided = existingDecided.filter(f => !pendingIds.has(f.fix_id));

    state.fixes = [...pending, ...updatedDecided];
    recountAll();
    renderFeed();
  } catch(err) {
    document.getElementById('ws-status').textContent = `API error: ${err.message}`;
  }
}

// ── Approve ───────────────────────────────────────────────────────────────────
async function approveFix(fix_id) {
  try {
    const res  = await fetch(`${API}/approve/${fix_id}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ approved_by: 'manager' }),
    });
    const data = await res.json();
    if (res.ok) {
      markDecided(fix_id, 'approved');
      showToast(`✅ Fix approved — ${data.applied?.applied ? 'written to DB' : 'queued'}`, 'ok');
    } else {
      showToast(`❌ Approve failed: ${data.detail}`, 'err');
    }
  } catch(err) {
    showToast(`❌ Network error: ${err.message}`, 'err');
  }
}

// ── Reject (modal) ────────────────────────────────────────────────────────────
function openRejectModal(fix_id) {
  _pendingRejectId = fix_id;
  document.getElementById('modal-fix-id').textContent = `fix_id: ${fix_id}`;
  document.getElementById('reject-reason').value = '';
  document.getElementById('reject-modal').classList.add('open');
}
function closeModal() {
  _pendingRejectId = null;
  document.getElementById('reject-modal').classList.remove('open');
}
async function confirmReject() {
  const fix_id = _pendingRejectId;
  const reason = document.getElementById('reject-reason').value.trim() || 'No reason provided';
  closeModal();
  try {
    const res  = await fetch(`${API}/reject/${fix_id}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rejected_by: 'manager', reason }),
    });
    const data = await res.json();
    if (res.ok) {
      markDecided(fix_id, 'rejected', reason);
      showToast(`❌ Fix rejected`, 'err');
    } else {
      showToast(`❌ Reject failed: ${data.detail}`, 'err');
    }
  } catch(err) {
    showToast(`❌ Network error: ${err.message}`, 'err');
  }
}

// ── Update local state after decision ─────────────────────────────────────────
function markDecided(fix_id, status, reason = '') {
  const fix = state.fixes.find(f => f.fix_id === fix_id);
  if (fix) {
    fix.status        = status;
    fix.reject_reason = reason;
    fix.decided_at    = new Date().toISOString();
  }
  recountAll();
  renderFeed();
}

// ── Counters ──────────────────────────────────────────────────────────────────
function recountAll() {
  const c = { pending:0, approved:0, rejected:0, auto:0, human:0 };
  state.fixes.forEach(f => {
    const s = f.status || 'pending';
    if (s === 'pending')  c.pending++;
    if (s === 'approved') { c.approved++; if (f.decided_by === 'auto') c.auto++; else c.human++; }
    if (s === 'rejected') c.rejected++;
  });
  state.counts = c;

  document.getElementById('h-pending').textContent  = c.pending;
  document.getElementById('h-approved').textContent = c.approved;
  document.getElementById('h-rejected').textContent = c.rejected;
  document.getElementById('s-pending').textContent  = c.pending;
  document.getElementById('s-auto').textContent     = c.auto;
  document.getElementById('s-human').textContent    = c.human;
  document.getElementById('s-rejected').textContent = c.rejected;

  const total = state.fixes.length;
  document.getElementById('f-all').textContent      = total;
  document.getElementById('f-pending').textContent  = c.pending;
  document.getElementById('f-approved').textContent = c.approved;
  document.getElementById('f-rejected').textContent = c.rejected;
}

// ── Filter ────────────────────────────────────────────────────────────────────
function setFilter(f, btn) {
  state.filter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderFeed();
}
function setTab(t, btn) {
  state.tab = t;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderFeed();
}

// ── Render ────────────────────────────────────────────────────────────────────
function renderFeed() {
  const feed = document.getElementById('fix-feed');
  const q    = document.getElementById('search-box').value.toLowerCase();

  let fixes = state.fixes.filter(f => {
    const s = f.status || 'pending';
    if (state.filter !== 'all' && s !== state.filter) return false;
    if (!q) return true;
    return JSON.stringify(f).toLowerCase().includes(q);
  });

  if (fixes.length === 0) {
    feed.innerHTML = '';
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    if (state.fixes.length === 0) {
      empty.innerHTML = `<span class="big">◈</span><span>No fixes yet</span><span style="font-size:11px">Worker 3 will send fixes here when anomalies are corrected</span>`;
    } else {
      empty.innerHTML = `<span class="big">○</span><span>No matching fixes</span><span style="font-size:11px">Try a different filter</span>`;
    }
    feed.appendChild(empty);
    return;
  }

  feed.innerHTML = '';
  fixes.forEach(fix => feed.appendChild(buildCard(fix)));
}

// ── Build fix card ────────────────────────────────────────────────────────────
function buildCard(fix) {
  const status     = fix.status || 'pending';
  const confidence = fix.confidence || 0;
  const confPct    = Math.round(confidence * 100);
  const confClass  = confPct >= 80 ? 'high' : confPct >= 60 ? 'mid' : 'low';

  const original    = fix.original    || {};
  const fixedFields = fix.fixed_fields || fix.fixed || {};
  const issues      = fix.issues      || [];
  const valErrors   = fix.validation_errors || [];

  const card = document.createElement('div');
  card.className = 'fix-card';

  // ── Status badge ──────────────────────────────────────────────────────
  const badgeClass = {
    pending:  'badge-pending',
    approved: 'badge-applied',
    rejected: 'badge-rejected',
  }[status] || 'badge-pending';

  const badgeLabel = {
    pending:  'PENDING',
    approved: 'APPROVED',
    rejected: 'REJECTED',
  }[status] || 'PENDING';

  // ── Diff: show original vs fixed fields ───────────────────────────────
  const changedKeys  = Object.keys(fixedFields);
  const origFieldsHTML = changedKeys.map(k =>
    `<div class="diff-field"><span class="diff-key">${k}</span><span class="diff-val changed">${esc(original[k] ?? '—')}</span></div>`
  ).join('') || '<span style="color:var(--muted);font-size:11px">no fields</span>';

  const fixedFieldsHTML = changedKeys.map(k =>
    `<div class="diff-field"><span class="diff-key">${k}</span><span class="diff-val fixed">${esc(fixedFields[k] ?? '—')}</span></div>`
  ).join('') || '<span style="color:var(--muted);font-size:11px">no changes</span>';

  // ── Issues chips ──────────────────────────────────────────────────────
  const issueChips = issues.slice(0,4).map(i =>
    `<span class="issue-tag">${esc(i.length > 60 ? i.slice(0,60)+'…' : i)}</span>`
  ).join('');

  // ── Validation errors ─────────────────────────────────────────────────
  const valErrHTML = valErrors.length ? `
    <div class="val-errors">
      <div class="val-error-label">⚠ Validation errors (${valErrors.length})</div>
      ${valErrors.map(e => `<div class="val-error-item">• ${esc(e)}</div>`).join('')}
    </div>` : '';

  // ── Review reason ─────────────────────────────────────────────────────
  const reviewReason = fix.review_reason
    ? `<div style="font-size:11px;color:var(--amber);margin-bottom:10px">⚠ Routed for human review — ${esc(fix.review_reason)}</div>`
    : '';

  // ── Action area ───────────────────────────────────────────────────────
  let actionHTML = '';
  if (status === 'pending') {
    actionHTML = `
      <div class="action-row">
        <button class="btn btn-approve" onclick="approveFix('${esc(fix.fix_id)}')">✅ Approve &amp; Apply to DB</button>
        <button class="btn btn-reject"  onclick="openRejectModal('${esc(fix.fix_id)}')">❌ Reject</button>
      </div>`;
  } else if (status === 'approved') {
    actionHTML = `<div class="decided-banner approved">✅ Approved${fix.decided_by ? ' by ' + esc(fix.decided_by) : ''} — fix applied to database</div>`;
  } else if (status === 'rejected') {
    const r = fix.reject_reason || 'No reason given';
    actionHTML = `<div class="decided-banner rejected">❌ Rejected — ${esc(r)}</div>`;
  }

  card.innerHTML = `
    <div class="fix-card-inner">
      <div class="card-top">
        <span class="status-badge ${badgeClass}">${badgeLabel}</span>
        <div class="conf-ring ${confClass}">${confPct}%</div>
        <div>
          <div class="card-title">${esc(original.name || 'Record #' + (original.id || '?'))}</div>
          <div class="card-sub">fix_id: ${esc(fix.fix_id)} &nbsp;·&nbsp; op: ${esc(fix.op || '?')}</div>
        </div>
        <div class="card-time">${esc(fix.ts || '')}</div>
      </div>

      <div class="issues-strip">${issueChips}</div>

      <div class="diff-row">
        <div class="diff-box">
          <div class="diff-box-label">Original</div>
          ${origFieldsHTML}
        </div>
        <div class="diff-arrow">→</div>
        <div class="diff-box">
          <div class="diff-box-label">Fixed</div>
          ${fixedFieldsHTML}
        </div>
      </div>

      <div class="explanation-box">
        💬 <span>${esc(fix.explanation || 'No explanation provided.')}</span>
      </div>

      ${valErrHTML}
      ${reviewReason}
      ${actionHTML}
    </div>`;

  return card;
}

// ── Toast ─────────────────────────────────────────────────────────────────────
function showToast(msg, type = 'ok') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className   = `show ${type}`;
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 3500);
}

// ── Escape HTML ───────────────────────────────────────────────────────────────
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Boot ──────────────────────────────────────────────────────────────────────
connectWS();
loadFixes();
setInterval(loadFixes, 15000);   // auto-refresh every 15s
</script>
</body>
