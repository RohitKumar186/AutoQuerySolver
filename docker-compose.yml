services:
  watchman_mysql:
    container_name: watchman_mysql
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./config/db_init.sql:/docker-entrypoint-initdb.d/db_init.sql
    command: --binlog-format=ROW --binlog-row-image=FULL --server-id=1 --log-bin=mysql-bin
    networks:
      - agent_network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: watchman_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - agent_network
    depends_on:
      - watchman_mysql

  debezium:
    image: debezium/connect:2.4
    container_name: watchman_debezium
    restart: always
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: my_connect_configs
      OFFSET_STORAGE_TOPIC: my_connect_offsets
      STATUS_STORAGE_TOPIC: my_connect_statuses
    depends_on:
      - watchman_mysql
      - kafka
    networks:
      - agent_network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: watchman_kafka_ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - agent_network
    depends_on:
      - kafka

  inspector_agent:
    build:
      context: ./worker2
      dockerfile: Dockerfile
    container_name: watchman_inspector
    restart: always
    ports:
      - "8765:8765"
    environment:
      KAFKA_BROKER: kafka:29092
      KAFKA_TOPIC: dbserver1.autoquery_db.customers
      KAFKA_GROUP: inspector-group
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROK_API_KEY: ${GROK_API_KEY}
    depends_on:
      - kafka
      - debezium
    networks:
      - agent_network

  doctor_agent:
    build:
      context: ./worker3
      dockerfile: Dockerfile
    container_name: watchman_doctor
    restart: always
    ports:
      - "8766:8766"
      - "8767:8767"
    environment:
      KAFKA_BROKER: kafka:29092
      KAFKA_TOPIC: dbserver1.autoquery_db.customers
      KAFKA_GROUP: doctor-group
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROK_API_KEY: ${GROK_API_KEY}
      CHROMA_PATH: /chroma_data
      WS_PORT: "8766"
    volumes:
      - chroma_data:/chroma_data                        # ChromaDB persistent storage
      - ./worker2/checks:/worker2/checks                # Reuse Worker 2 rule + duplicate checks
    depends_on:
      - kafka
      - debezium
      - inspector_agent
    networks:
      - agent_network

  # ── Worker 4 — The Checker ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: watchman_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - agent_network

  checker_agent:
    build:
      context: ./worker4
      dockerfile: Dockerfile
    container_name: watchman_checker
    restart: always
    ports:
      - "8000:8000"         # FastAPI approve/reject API
    environment:
      CHROMA_PATH: /chroma_data
      DB_HOST: watchman_mysql
      DB_PORT: "3306"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      REDIS_URL: redis://redis:6379
      AUTO_APPROVE_THRESHOLD: "0.80"
      POLL_INTERVAL: "10"
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      SLACK_WEBHOOK: ${SLACK_WEBHOOK}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO}
      APPROVAL_URL: "http://localhost:8000"
    volumes:
      - chroma_data:/chroma_data    # shared with Worker 3 — reads fixes from here
    depends_on:
      - doctor_agent
      - redis
      - watchman_mysql
    networks:
      - agent_network

  # ── Dashboards ──────────────────────────────────────────────────────────────
  dashboard:
    image: nginx:alpine
    container_name: watchman_dashboard
    ports:
      - "5500:80"
    volumes:
      - ./worker2/dashboard.html:/usr/share/nginx/html/index.html
    networks:
      - agent_network

  doctor_dashboard:
    image: nginx:alpine
    container_name: watchman_doctor_dashboard
    ports:
      - "5501:80"
    volumes:
      - ./worker3/doctor_dashboard.html:/usr/share/nginx/html/index.html
    networks:
      - agent_network

  checker_dashboard:
    image: nginx:alpine
    container_name: watchman_checker_dashboard
    ports:
      - "5502:80"                   # Worker 4 approval UI
    volumes:
      - ./worker4/checker_dashboard.html:/usr/share/nginx/html/index.html
    networks:
      - agent_network

volumes:
  mysql_data:
  kafka_data:
  chroma_data:    # ChromaDB persistent storage — shared by Worker 3 + Worker 4

networks:
  agent_network:
    name: agent_network
    driver: bridge